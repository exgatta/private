<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイクラ設計図メーカー</title>
</head>
<body>

<!-- ============================================================
     ▼▼▼ ここだけ書き換える ▼▼▼
     Gemini が作った設計データ（JSON）を、下の { } の中に貼り付けます。
     null のままでも大丈夫です。その場合は画面の貼り付け欄が使えます。
     ============================================================ -->
<script>
var DESIGN = null;
</script>
<!-- ▲▲▲ 書き換えるのはここまで ▲▲▲ -->


<!-- ============================================================
     ここから下は設計図を描くプログラムです。さわらないでください。
     ============================================================ -->
<script>
<<RENDERER>>
</script>

<script>
(function () {
  "use strict";
  var MB = window.MinecraftBlueprint;

  // DESIGN が入っていれば renderer が自動で描画するので、貼り付け欄は出さない
  if (DESIGN && typeof DESIGN === "object") return;

  var css = document.createElement("style");
  css.textContent = MB.CSS + "\n" + [
    ".paste-wrap{max-width:980px;margin:0 auto;padding:32px 20px 72px}",
    ".paste-box{width:100%;min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;",
    "  font-size:13px;line-height:1.5;padding:14px;border-radius:6px;",
    "  border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical}",
    ".paste-box:focus{outline:3px solid var(--accent);outline-offset:1px}",
    ".btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}",
    ".btn{font:inherit;font-weight:700;font-size:16px;padding:12px 24px;border-radius:6px;",
    "  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}",
    ".btn:hover{border-color:var(--accent)}",
    ".btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}",
    ".btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}",
    ".err{margin-top:16px;padding:14px 16px;border-radius:6px;border:1px solid #c0392b;",
    "  background:rgb(192 57 43 / 12%);color:var(--ink);font-size:14.5px;white-space:pre-wrap}",
    ".steps{color:var(--muted);font-size:14px;line-height:1.9;padding-left:1.3em;margin:0 0 20px}",
    "@media print{.noprint{display:none!important}}",
  ].join("\n");
  document.head.appendChild(css);

  var wrap = document.createElement("main");
  wrap.className = "paste-wrap noprint";
  wrap.innerHTML = [
    '<header class="hero">',
    '<p class="eyebrow">MINECRAFT EDUCATION 設計図メーカー</p>',
    "<h1>設計データを貼り付けてください</h1>",
    '<p class="desc">Gemini が作った JSON をここに貼って「設計図を作る」を押すと、',
    "レゴの説明書のような設計図になります。インターネットにつながっていなくても動きます。</p>",
    "</header>",
    '<ol class="steps">',
    "<li>Gemini に <b>PROMPT.md</b> の中身を貼る</li>",
    "<li>続けて「◯◯の設計図を作って」と書く</li>",
    "<li>出てきた JSON をコピーして、下の欄に貼る</li>",
    "</ol>",
    '<textarea class="paste-box" id="src" spellcheck="false" ',
    'placeholder=\'{ "name": "…", "ops": [ … ] }\'></textarea>',
    '<div class="btnrow">',
    '<button class="btn primary" id="go">設計図を作る</button>',
    '<button class="btn" id="pick">ファイルから読み込む</button>',
    '<input type="file" id="file" accept=".json,.txt" hidden>',
    "</div>",
    '<div id="err" hidden></div>',
  ].join("");
  document.body.appendChild(wrap);

  var $ = function (id) { return document.getElementById(id); };

  function showError(msg) {
    var e = $("err");
    e.className = "err";
    e.textContent = msg;
    e.hidden = false;
  }

  function parseDesign(text) {
    var t = String(text).trim();
    if (!t) throw new Error("設計データが空です。Gemini が出した JSON を貼り付けてください。");
    // ```json … ``` で囲まれていても読めるようにする
    var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) t = fence[1].trim();
    // 前後に説明文が付いていても、最初の { から最後の } までを拾う
    if (t[0] !== "{") {
      var s = t.indexOf("{"), e = t.lastIndexOf("}");
      if (s === -1 || e === -1) throw new Error("JSON が見つかりません。{ で始まり } で終わる部分を貼り付けてください。");
      t = t.slice(s, e + 1);
    }
    var obj;
    try {
      obj = JSON.parse(t);
    } catch (ex) {
      throw new Error("JSON の形が正しくありません。\n（" + ex.message + "）\n"
        + "Gemini に「JSONだけをもう一度出して」と頼むと直ることが多いです。");
    }
    if (!obj || (!obj.ops && !obj.blocks)) {
      throw new Error('"ops" が入っていません。設計データの形が違うようです。');
    }
    return obj;
  }

  function render(text) {
    try {
      var design = parseDesign(text);
      document.body.innerHTML = "";
      MB.mount(design);
      addPrintBar();
    } catch (ex) {
      showError(ex.message);
    }
  }

  function addPrintBar() {
    var bar = document.createElement("div");
    bar.className = "noprint";
    bar.style.cssText = "position:fixed;right:18px;bottom:18px;display:flex;gap:10px;z-index:9";
    var p = document.createElement("button");
    p.className = "btn primary";
    p.textContent = "印刷する";
    p.onclick = function () { window.print(); };
    var b = document.createElement("button");
    b.className = "btn";
    b.textContent = "別の設計図";
    b.onclick = function () { location.reload(); };
    bar.appendChild(p);
    bar.appendChild(b);
    document.body.appendChild(bar);
  }

  $("go").onclick = function () { render($("src").value); };
  $("pick").onclick = function () { $("file").click(); };
  $("file").onchange = function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { $("src").value = r.result; render(r.result); };
    r.readAsText(f, "utf-8");
  };
})();
</script>
</body>
</html>
