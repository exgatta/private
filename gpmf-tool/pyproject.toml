[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpmf-tool"
version = "1.0.0"
description = "GPMF (GoPro Metadata Format) の完全パーサと、他社カメラ動画へのGoProメタデータ注入ツール"
readme = "gpmf_tool/README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "tkinterdnd2>=0.4", "pillow>=9.0"]
gui = ["tkinterdnd2>=0.4", "pillow>=9.0"]  # ウィンドウへのドラッグ&ドロップ (任意)

[project.scripts]
gpmf = "gpmf_tool.__main__:main"

[project.gui-scripts]
gpmf-gui = "gpmf_tool.gui:run"

[tool.setuptools]
packages = ["gpmf_tool", "gpmf_tool.webui"]

[tool.setuptools.package-data]
# 結合選択画面 (Web UI) の静的ファイル
"gpmf_tool.webui" = ["static/*"]
