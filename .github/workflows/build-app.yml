name: Build gpmf app (Windows / macOS)

# Mac 用 (Apple Silicon) と Windows 用のバイナリを、それぞれの実機ランナー上で
# 別々にビルドする。(PyInstaller はクロスコンパイル不可のため OS ごとに必要)
#
# 実行: Actions タブ → "Build gpmf app" → Run workflow
# 完了後、実行結果ページ下部の Artifacts からバイナリをダウンロードする。

on:
  workflow_dispatch:        # 手動実行のみ (配布しないため自動リリースはしない)

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gpmf-windows
            binary: dist/gpmf.exe
            asset: gpmf-windows.exe
          - os: macos-latest          # Apple Silicon (arm64)
            artifact: gpmf-macos-arm64
            binary: dist/gpmf
            asset: gpmf-macos-arm64

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.artifact }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s gpmf_tool/tests

      - name: Build binary
        run: python -m PyInstaller --clean --noconfirm gpmf_tool.spec

      - name: Smoke test (CLI)
        shell: bash
        run: |
          "${{ matrix.binary }}" --help || true
          "${{ matrix.binary }}" inject --help

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
