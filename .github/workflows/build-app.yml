name: Build gpmf app (Windows / macOS)

# Mac 用と Windows 用のバイナリを、それぞれの実機ランナー上で別々にビルドする。
# (PyInstaller はクロスコンパイル不可のため、OS ごとにネイティブビルドが必要)
#
# 手動実行:      Actions タブ → "Build gpmf app" → Run workflow
# タグ push 時:  v* タグを push すると自動ビルド + Release への添付

on:
  workflow_dispatch:        # 手動実行
  push:
    tags:
      - "v*"                 # v1.0.0 などのタグで自動ビルド

permissions:
  contents: write           # Release へのアップロード用

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gpmf-windows
            binary: dist/gpmf.exe
            asset: gpmf-windows.exe
          - os: macos-latest          # Apple Silicon (arm64)
            artifact: gpmf-macos-arm64
            binary: dist/gpmf
            asset: gpmf-macos-arm64
          - os: macos-13              # Intel (x86_64)
            artifact: gpmf-macos-x64
            binary: dist/gpmf
            asset: gpmf-macos-x64

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.artifact }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s gpmf_tool/tests

      - name: Build binary
        run: python -m PyInstaller --clean --noconfirm gpmf_tool.spec

      - name: Smoke test (CLI)
        shell: bash
        run: |
          "${{ matrix.binary }}" --help || true
          "${{ matrix.binary }}" inject --help

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
